[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-exchange-signal-ledger"
version = "0.1.0"
description = "基于 Python 的多交易所信号执行与账本管理系统：离线演示与工程实现"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "websockets==17.3",
]

[project.scripts]
signal-ledger-demo = "signal_ledger.__main__:main"

[tool.setuptools.packages.find]
include = ["signal_ledger*"]

[tool.setuptools.package-data]
signal_ledger = ["fixtures/*.json", "static/*.html"]
